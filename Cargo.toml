[package]
name = "bitvavo-client"
version = "0.1.0"
edition = "2024"
description = "Async Rust client for the Bitvavo REST and WebSocket API"
license = "MIT"

[lib]
path = "src/lib.rs"
name = "bitvavo_client"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
dotenvy = "0.15"
